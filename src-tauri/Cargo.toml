[package]
name = "uni-pilot"
version = "0.1.0"
description = "Uni Pilot — a personal operating system for university life"
authors = ["Uni Pilot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "uni_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` for Window::add_child, which embeds ILIAS in the main window
# (src/ilias_view.rs). Tauri marks multi-webview as unfinished; that module
# keeps the separate ILIAS window in src/ilias_window.rs as the fallback.
tauri = { version = "2", features = ["unstable"] }
# Calendar subscriptions are fetched here rather than in the webview: feeds
# carry no CORS headers, so the browser would refuse them.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Back and forward in ILIAS (src/ilias_browser.rs) go straight to each
# platform's webview, which Tauri does not expose. All three already come in
# through Tauri; these only name them, at the versions Tauri uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
