[package]
name = "uni-pilot"
version = "0.1.0"
description = "Uni Pilot — a personal operating system for university life"
authors = ["Uni Pilot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "uni_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
