[package]
name = "uni-pilot"
version = "0.1.0"
description = "Uni Pilot — a personal operating system for university life"
authors = ["Uni Pilot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "uni_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` for Window::add_child, which embeds ILIAS in the main window
# (src/ilias_view.rs). Tauri marks multi-webview as unfinished; that module
# keeps the separate ILIAS window in src/ilias_window.rs as the fallback.
# `macos-private-api` for the notch window's see-through background (src/notch.rs).
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
# Calendar subscriptions are fetched here rather than in the webview: feeds
# carry no CORS headers, so the browser would refuse them.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Reading ILIAS pages for the sync (src/ilias_sync/). HTML is parsed here, not
# in the webview, so the page never holds ILIAS markup with its rtokens.
scraper = "0.24"
# One sync request at a time, a pause between them. Already in the tree
# through Tauri and reqwest; named here for the timer and the lock.
tokio = { version = "1", features = ["time", "sync"] }
# The local date, to read ILIAS's "Heute, 10:12". Already in the tree.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Signing in automatically (src/vault.rs): the HHN password and Uni Pilot's own
# authenticator live in the platform's credential store — Keychain, Credential
# Manager, Secret Service (D-Bus, already in the tree through tao) — never in a
# file. Secrets are wiped from memory when dropped.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
totp-rs = { version = "6", features = ["otpauth", "zeroize"] }
zeroize = "1"
# Face unlock (src/face_unlock/): YuNet and SFace run here, on the CPU, from
# ONNX files in models/ — the camera frames never leave Rust. tract loads both
# at a fixed input size (spike 0.5 in docs/face-unlock-plan.md); SFace int8
# does not load in tract, so it is the fp32 file.
tract-onnx = "0.23.8"
# The page sends camera frames as JPEG; nothing else is decoded.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Back and forward in ILIAS, and downloads the macOS webview would otherwise
# show (src/ilias_browser.rs), go straight to each platform's webview, which
# Tauri does not expose. All of these already come in through Tauri; they are
# only named here, at the versions Tauri uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURLResponse", "NSArray", "NSGeometry"] }
# Face unlock in the notch (src/notch.rs): where the notch is, a window above
# the menu bar that lets clicks beside it through. The version Tauri uses.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSEvent", "NSWindow", "NSResponder", "NSGraphics"] }
# The Keychain's own error codes, to tell "you clicked Deny" from a broken
# Keychain (src/vault.rs). The version keyring uses; only named here.
security-framework = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
# ILIAS mode on Linux shares the window's GTK box (src/ilias_view.rs).
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
httpmock = "0.8"
