[package]
name = "uni-pilot"
version = "0.1.0"
description = "Uni Pilot — a personal operating system for university life"
authors = ["Uni Pilot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "uni_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` for Window::add_child, which embeds ILIAS in the main window
# (src/ilias_view.rs). Tauri marks multi-webview as unfinished; that module
# keeps the separate ILIAS window in src/ilias_window.rs as the fallback.
tauri = { version = "2", features = ["unstable"] }
# Calendar subscriptions are fetched here rather than in the webview: feeds
# carry no CORS headers, so the browser would refuse them.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Reading ILIAS pages for the sync (src/ilias_sync/). HTML is parsed here, not
# in the webview, so the page never holds ILIAS markup with its rtokens.
scraper = "0.24"
# One sync request at a time, a pause between them. Already in the tree
# through Tauri and reqwest; named here for the timer and the lock.
tokio = { version = "1", features = ["time", "sync"] }
# The local date, to read ILIAS's "Heute, 10:12". Already in the tree.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The newest mail kept on this Mac, encrypted (src/mail_cache.rs): AES-256-GCM
# and the random it needs. Already in the tree through rustls.
ring = "0.17"

# Back and forward in ILIAS, and downloads the macOS webview would otherwise
# show (src/ilias_browser.rs), go straight to each platform's webview, which
# Tauri does not expose. All of these already come in through Tauri; they are
# only named here, at the versions Tauri uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURLResponse"] }
# The key to the mail kept on this Mac (src/mail_cache.rs) lives in the
# Keychain. Mail is Mac only, so the key is too.
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
# ILIAS mode on Linux shares the window's GTK box (src/ilias_view.rs).
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
